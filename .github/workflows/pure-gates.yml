# pure-gates - every push, pure logic only.
#
#   tests    `node --test test/*.test.js` - the account/permission/
#            session/input-validator suites, in-process, no DB or
#            network bring-up.
#
# No servers, no SITL, no sim bring-up.
name: pure-gates
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # package-lock.json is gitignored in this repo - npm install, not ci
      - name: install
        run: npm install --no-audit --no-fund

      - name: test
        run: npm test
